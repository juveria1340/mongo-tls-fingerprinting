# Three microservices from one image; SERVICE selects the routes.
# replicas: 2 gives multiple client flows per service (more realistic, more data).
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-api, namespace: fingerprint }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-api } }
  template:
    metadata: { labels: { app: user-api, tier: api } }
    spec:
      containers:
        - name: api
          image: fp-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE, value: user }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
          volumeMounts: [{ name: ca, mountPath: /etc/mongo-ca, readOnly: true }]
      volumes: [{ name: ca, secret: { secretName: mongo-ca } }]
---
apiVersion: v1
kind: Service
metadata: { name: user-api, namespace: fingerprint }
spec:
  selector: { app: user-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
